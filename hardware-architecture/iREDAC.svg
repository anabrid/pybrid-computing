  <title
     id="title">iREDAC architecture overview</title>
  <desc
     id="desc">Simplified block diagram showing one iREDAC as a backplane with seven mounted mREDACs, frontplane access, a rear coverplane, external analog differential I/O, sync links, power input, USB access, Ethernet access, and optional stacking with adjacent iREDACs.</desc>
