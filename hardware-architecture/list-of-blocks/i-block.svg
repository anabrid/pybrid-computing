  <title
     id="title">I-Block architecture</title>
  <desc
      id="desc">Diagram showing C-Block and routed lanes entering the I-Block, voltage-to-current conversion with optional upscaling, a 32 by 16 summation matrix, and summed outputs entering the SH-Block offset-compensation stage.</desc>
