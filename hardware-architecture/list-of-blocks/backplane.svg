  <title
     id="title">iREDAC backplane architecture</title>
  <desc
     id="desc">Simplified block diagram of the iREDAC backplane with seven mREDAC slots, Slot 0 as the main control and sync-control slot, backplane TBL routing, LAN/Ethernet paths to the mREDAC controller interfaces, sync signal distribution across all slots, and adjacent iREDAC paths above and below the local backplane.</desc>
