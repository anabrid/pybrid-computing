  <text
     class="small"
     x="143"
     y="610"
     id="text39">Lane invariant:</text>
  <text
     class="tiny"
     x="245"
     y="610"
     id="text40">U-Block output lane n feeds C-Block channel n, and C-Block output lane n remains lane n.</text>
  <text
     class="tiny"
     x="245"
     y="630"
     id="text41">Lanes 0..7 are hard-wired local paths; lanes 8..31 are bitwise routed/shareable paths.</text>
  <text
