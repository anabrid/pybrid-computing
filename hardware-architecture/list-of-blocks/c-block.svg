     y="48"
     id="text2">C-Block: Per-Lane Coefficient Multiplication</text>
  <text
     class="subtitle"
     x="40"
     y="75"
     id="text3">Thirty-two independent scalar multiplication channels: lanes 0..7 are direct local paths, lanes 8..31 are routed/shareable paths.</text>
