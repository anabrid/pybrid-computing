  <title
     id="title">C-Block architecture</title>
  <desc
     id="desc">Block diagram showing 32 lane-aligned coefficient channels between the U-Block source selection and the I-Block or T-Block destinations, with lanes 0 through 7 direct local and lanes 8 through 31 routed or shareable.</desc>
  <defs
     id="defs2">
    <marker
       id="arrow"
       markerWidth="10"
       markerHeight="10"
       refX="9"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L0,6 L9,3 z"
         fill="#1f2937"
         id="path1" />
    </marker>
    <marker
       id="arrowBlue"
       markerWidth="10"
       markerHeight="10"
       refX="9"
       refY="3"
       orient="auto"
       markerUnits="strokeWidth">
      <path
         d="M0,0 L0,6 L9,3 z"
         fill="#2563eb"
         id="path2" />
    </marker>
    <style
       id="style2">
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .tiny { font: 12px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .soft { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 12; }
      .coeff { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .digital { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 12; }
      .lane { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .control { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-dasharray: 7 5; marker-end: url(#arrowBlue); }
      .divider { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    </style>
  </defs>
