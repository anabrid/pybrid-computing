  <title
     id="title">M-Block MUL architecture</title>
  <desc
     id="desc">Block diagram showing eight logical MUL inputs, four fixed multiplier cells, product outputs, ID path outputs, digital calibration, overload monitoring, and constant-giver shadowing for two ID outputs.</desc>
