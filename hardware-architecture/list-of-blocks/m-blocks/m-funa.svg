     x="265"
     y="545"
     width="600"
     height="110"
     class="cellAlt"
     id="rect47" />
  <text
     x="285"
     y="570"
     class="label"
     id="text48">LEX cell 0</text>
  <text
     x="285"
     y="592"
     class="tiny"
     id="text49">bias settings:</text>
  <text
     x="285"
     y="610"
     class="tiny"
     id="text50">reference, A12, A30</text>
  <rect
     x="430"
     y="556"
     width="228"
     height="34"
     class="cellInnerAlt"
     id="rect50" />
  <text
     x="442"
     y="578"
     class="text"
     id="text51">out 6 = 0.375 per decade log</text>
  <rect
     x="430"
     y="596"
     width="228"
     height="34"
     class="cellInnerAlt"
     id="rect51" />
  <text
     x="442"
     y="618"
     class="text"
     id="text52">or exponential, positive only</text>
  <text
     x="676"
     y="578"
     class="tiny"
     id="text53">mode: LOG | EXP |</text>
  <text
     x="676"
     y="598"
     class="tiny"
     id="text54">EXP_HIGH_SENSE | EXP_RESET</text>
  <text
     x="676"
     y="618"
     class="tiny"
     id="text55">mode register bits 8 to 10</text>
  <text
     x="285"
     y="643"
     class="tiny"
     id="text56">one input polarity only, about +/- 2.6 decades inside the normalized range</text>
  <rect
     x="265"
     y="667"
     width="600"
     height="110"
     class="cellAlt"
     id="rect56" />
  <text
     x="285"
     y="692"
     class="label"
     id="text57">LEX cell 1</text>
  <text
     x="285"
     y="714"
     class="tiny"
     id="text58">bias settings:</text>
  <text
     x="285"
     y="732"
     class="tiny"
     id="text59">reference, A12, A30</text>
  <rect
     x="430"
     y="678"
     width="228"
     height="34"
     class="cellInnerAlt"
     id="rect59" />
  <text
     x="442"
     y="700"
     class="text"
     id="text60">out 7 = 0.375 per decade log</text>
  <rect
     x="430"
     y="718"
     width="228"
     height="34"
     class="cellInnerAlt"
     id="rect60" />
  <text
     x="442"
     y="740"
     class="text"
     id="text61">or exponential, positive only</text>
  <text
     x="676"
     y="700"
     class="tiny"
     id="text62">mode: LOG | EXP |</text>
  <text
     x="676"
     y="720"
     class="tiny"
     id="text63">EXP_HIGH_SENSE | EXP_RESET</text>
  <text
     x="676"
     y="740"
     class="tiny"
     id="text64">mode register bits 11 to 13</text>
  <text
     x="285"
     y="765"
     class="tiny"
     id="text65">exponential path can saturate, EXP_RESET returns it to a defined state</text>
