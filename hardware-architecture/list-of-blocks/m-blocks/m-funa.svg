  <!-- MIN/MAX cells -->
  <rect
     x="265"
     y="188"
     width="600"
     height="92"
     class="cell"
     id="rect30" />
  <text
     x="285"
     y="212"
     class="label"
     id="text31">MINMAX cell 0</text>
  <text
     x="285"
     y="234"
     class="tiny"
     id="text32">no bias settings,</text>
  <text
     x="285"
     y="252"
     class="tiny"
     id="text33">no calibration</text>
  <rect
     x="440"
     y="198"
     width="210"
     height="34"
     class="cellInner"
     id="rect33" />
  <text
     x="452"
     y="220"
     class="text"
     id="text34">out 0 = min(a, b) | id(a)</text>
  <rect
     x="440"
     y="238"
     width="210"
     height="34"
     class="cellInner"
     id="rect34" />
  <text
     x="452"
     y="260"
     class="text"
     id="text35">out 1 = max(a, b) | id(b)</text>
  <text
     x="668"
     y="222"
     class="tiny"
     id="text36">both results available at once</text>
  <text
     x="668"
     y="248"
     class="tiny"
     id="text37">identity bits 0 and 1</text>
  <rect
     x="265"
     y="295"
     width="600"
     height="92"
     class="cell"
     id="rect37" />
  <text
     x="285"
     y="319"
     class="label"
     id="text38">MINMAX cell 1</text>
  <rect
     x="440"
     y="305"
     width="210"
     height="34"
     class="cellInner"
     id="rect38" />
  <text
     x="452"
     y="327"
     class="text"
     id="text39">out 2 = min(a, b) | id(a)</text>
  <rect
     x="440"
     y="345"
     width="210"
     height="34"
     class="cellInner"
     id="rect39" />
  <text
     x="452"
     y="367"
     class="text"
     id="text40">out 3 = max(a, b) | id(b)</text>
  <text
     x="668"
     y="329"
     class="tiny"
     id="text41">each output switches on its own</text>
  <text
     x="668"
     y="355"
     class="tiny"
     id="text42">identity bits 2 and 3</text>
  <rect
     x="265"
     y="402"
     width="600"
     height="92"
     class="cell"
     id="rect42" />
  <text
     x="285"
     y="426"
     class="label"
     id="text43">MINMAX cell 2</text>
  <rect
     x="440"
     y="412"
     width="210"
     height="34"
     class="cellInner"
     id="rect43" />
  <text
     x="452"
     y="434"
     class="text"
     id="text44">out 4 = min(a, b) | id(a)</text>
  <rect
     x="440"
     y="452"
     width="210"
     height="34"
     class="cellInner"
     id="rect44" />
  <text
     x="452"
     y="474"
     class="text"
     id="text45">out 5 = max(a, b) | id(b)</text>
  <text
     x="668"
     y="436"
     class="tiny"
     id="text46">identity is a true copy of the input</text>
  <text
     x="668"
     y="462"
     class="tiny"
     id="text47">identity bits 4 and 5</text>
