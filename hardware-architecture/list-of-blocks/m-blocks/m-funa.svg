  <title
     id="title">M-Block FUNA architecture</title>
  <desc
     id="desc">Block diagram showing eight logical FUNA inputs, three MIN/MAX cells on lanes 0 to 5, two LEX logarithm and exponential cells on lanes 6 and 7, the eight logical outputs, and the mode register and bias settings that configure them.</desc>
