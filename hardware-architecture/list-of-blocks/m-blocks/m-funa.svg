  <text
     x="60"
     y="852"
     class="label"
     id="text96">Configuration and calibration</text>
  <text
     x="60"
     y="876"
     class="small"
     id="text97">One 16-bit mode register holds all identity flags and both LEX modes</text>
  <text
     x="60"
     y="896"
     class="small"
     id="text98">Three bias values per LEX cell: reference current, A12 and A30 offset</text>
  <text
     x="60"
     y="916"
     class="small"
     id="text99">Firmware calibrates both LEX cells against the cluster ADC readout</text>
  <text
     x="60"
     y="940"
     class="tiny"
     id="text100">Reset state: min/max on every MIN/MAX cell, both LEX cells in LOG mode</text>
