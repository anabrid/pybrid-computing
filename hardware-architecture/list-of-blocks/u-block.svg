  <title
     id="title">U-Block Voltage Distribution Architecture</title>
  <desc
     id="desc">Block diagram of the U-Block. M-Block outputs and reference voltages feed source multiplexers, which provide 16 crossbar inputs. A 16 by 32 analog crossbar distributes selected voltages onto the 32 C-Block coefficient input lanes.</desc>
