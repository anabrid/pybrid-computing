  <text
     class="label"
     x="590"
     y="180"
     id="text21">REDAC system role</text>
  <text
     class="small"
     x="590"
     y="212"
     id="text22">The REDAC is the rack-level system that combines multiple iREDAC stack levels.</text>
  <text
     class="small"
     x="590"
     y="238"
     id="text23">Each iREDAC contributes its own backplane, mREDAC slots, routing, sync, and interfaces.</text>
  <text
     class="small"
     x="590"
     y="264"
     id="text24">The current rack uses four iREDAC levels; reserved space can support expansion.</text>
  <rect
     class="controller"
     x="560"
     y="340"
     width="285"
     height="170"
     id="rect24" />
  <text
     class="label"
     x="590"
     y="375"
     id="text25">Super controller</text>
  <text
     class="small"
     x="590"
     y="407"
     id="text26">Server-level computer</text>
  <text
     class="small"
     x="590"
     y="433"
     id="text27">Network configuration point</text>
  <text
     class="small"
     x="590"
     y="459"
     id="text28">Computation configuration gateway</text>
  <text
     class="small"
     x="590"
     y="485"
     id="text29">Controller coordination point</text>
  <rect
     class="network"
     x="895"
     y="340"
     width="285"
     height="170"
     id="rect29" />
  <text
     class="label"
     x="925"
     y="375"
     id="text30">LAN switch</text>
  <text
     class="small"
     x="925"
     y="407"
     id="text31">Rack-level Ethernet switching</text>
  <text
     class="small"
     x="925"
     y="433"
     id="text32">Connects super controller</text>
  <text
     class="small"
     x="925"
     y="459"
     id="text33">Provides network path to iREDACs</text>
  <text
     class="small"
     x="925"
     y="485"
     id="text34">Carries controller traffic</text>
  <rect
     class="iredac"
     x="560"
     y="555"
     width="620"
     height="185"
     id="rect34" />
  <text
     class="label"
     x="590"
     y="590"
     id="text35">Stacked iREDAC levels</text>
  <text
     class="small"
     x="590"
     y="622"
     id="text36">iREDAC 0..3 are the populated analog-computing stack levels.</text>
  <text
     class="small"
     x="590"
     y="648"
     id="text37">Stack-level routing and synchronization paths allow iREDACs to operate together.</text>
  <text
     class="small"
     x="590"
     y="674"
     id="text38">A fifth iREDAC can be added in a supported rack configuration.</text>
  <text
     class="small"
     x="590"
     y="700"
     id="text39">Additional REDAC racks can also be connected for larger systems.</text>
  <text
     class="small"
     x="590"
     y="726"
     id="text40">Rack services provide power, network access and controller configuration.</text>
</svg>
