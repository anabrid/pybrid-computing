  <title
     id="title">REDAC rack architecture overview</title>
  <desc
     id="desc">Simplified block diagram of a REDAC as a 19-inch rack containing power supply, LAN switch, super controller, reserved expansion/service space and four stacked iREDAC levels.</desc>
