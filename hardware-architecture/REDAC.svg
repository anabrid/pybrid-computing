      .controller { fill: #f3e8ff; stroke: #7e22ce; stroke-width: 2; rx: 8; }
      .network { fill: #ecfdf5; stroke: #047857; stroke-width: 1.8; rx: 8; }
      .power { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.8; rx: 8; }
      .fan { fill: #e2e8f0; stroke: #475569; stroke-width: 1.8; rx: 8; }
      .note { fill: #ffffff; stroke: #64748b; stroke-width: 1.6; rx: 14; }
      .line { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; marker-end: url(#arrow); }
